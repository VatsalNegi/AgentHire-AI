<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Role-specific interview practice and thoughtful AI-generated feedback."
    />
    <meta name="theme-color" content="#101014" />
    <style>
      .boot-screen {
        display: grid;
        min-height: 100vh;
        align-content: center;
        justify-items: center;
        padding: 32px;
        background:
          radial-gradient(ellipse at 50% 42%, rgb(94 67 121 / 12%), transparent 38%),
          #101014;
        color: #eeeaf1;
        font-family: "Segoe UI", Arial, sans-serif;
      }

      .boot-brand {
        display: flex;
        align-items: center;
        gap: 12px;
        animation: boot-reveal 460ms cubic-bezier(0.2, 0.7, 0.2, 1) both;
      }

      .boot-monogram {
        display: grid;
        width: 36px;
        height: 36px;
        place-items: center;
        border: 1px solid #68527f;
        background: #211b29;
        color: #d7c2ef;
        font-size: 18px;
        font-weight: 650;
      }

      .boot-wordmark {
        font-size: 21px;
        font-weight: 600;
        letter-spacing: -0.8px;
      }

      .boot-wordmark span {
        margin-left: 5px;
        color: #b79ad7;
        font-size: 10px;
        font-weight: 650;
        letter-spacing: 1.8px;
        text-transform: uppercase;
      }

      .boot-indicator {
        position: relative;
        width: 25px;
        height: 25px;
        margin-top: 32px;
        border: 1px solid #39313f;
        border-radius: 50%;
        animation: boot-orbit 1.2s linear infinite;
      }

      .boot-indicator::before {
        position: absolute;
        top: -3px;
        left: 10px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #c4a8e2;
        box-shadow: 0 0 12px rgb(190 157 222 / 56%);
        content: "";
      }

      .boot-line {
        overflow: hidden;
        width: 150px;
        height: 1px;
        margin-top: 21px;
        background: #29242f;
      }

      .boot-line::after {
        display: block;
        width: 38%;
        height: 100%;
        transform: translateX(-110%);
        background: linear-gradient(90deg, transparent, #a88bc9, transparent);
        animation: boot-sweep 1.05s ease-in-out infinite;
        content: "";
      }

      .boot-caption {
        margin: 13px 0 0;
        color: #898291;
        font-size: 9px;
        letter-spacing: 1.65px;
      }

      @keyframes boot-reveal {
        from {
          transform: translateY(5px);
          opacity: 0;
        }

        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      @keyframes boot-orbit {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes boot-sweep {
        to {
          transform: translateX(390%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-brand {
          animation: none;
        }

        .boot-indicator,
        .boot-line::after {
          animation: none;
        }

        .boot-indicator::before {
          left: 10px;
        }
      }
    </style>
    <title>AgentHire AI - Interview Practice</title>
  </head>
  <body>
    <div id="root">
      <div class="boot-screen" role="status" aria-label="Loading AgentHire AI">
        <div class="boot-brand">
          <span class="boot-monogram" aria-hidden="true">A</span>
          <span class="boot-wordmark">AgentHire<span>AI</span></span>
        </div>
        <span class="boot-indicator" aria-hidden="true"></span>
        <span class="boot-line" aria-hidden="true"></span>
        <p class="boot-caption">INTERVIEW PRACTICE, REFINED</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
